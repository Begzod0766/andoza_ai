# The site as the frontend container serves it (host nginx terminates TLS and proxies here).
#
# Caching: with no Cache-Control the iOS app's WebView cached index.html by itself and kept an old
# Studio after a deploy (mobile QA 2026-11-13, #244). The page and the service worker files are
# revalidated on every load; the hashed bundles under /assets/ never change, so they cache for a year.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed file names: a new build is new URLs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker, its loader and the manifest: always ask the server.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The page itself, and every client-side route (/studio/... etc.), which falls back to it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
