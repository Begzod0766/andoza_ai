name: Deploy to server

# Deploys only after CI ("CI", ci.yml) has passed for the same commit. Before this the
# deploy ran on the push itself, in parallel with CI, so a red test still shipped to
# andozaai.uz with its migrations. workflow_run always uses this file as it is on the
# default branch, and runs with the repository's secrets.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # Manual deploy of the chosen ref; does not wait for CI.
  workflow_dispatch:

# One deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Images are built here and pushed to ghcr.io; the server only pulls them.
# Building on the VPS meant apt-get and npm over its slow uplink, and on
# 2026-11-02 four deploys in a row died there (docker-compose.images.yml).
permissions:
  contents: read
  packages: write

# The images live under the repository's owner (ghcr.io names are lower case), so the
# workflow keeps working if the repository moves to another account.
jobs:
  # Decides whether this run deploys, and which commit.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `event == 'push'`: `branches: [master]` matches the head branch NAME, so a pull
    # request from a fork whose branch is called master would also trigger this.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # CI runs for two quick merges can finish out of order. Deploying the older one last
      # would put old code on top of the newer commit's migrations, so only master's tip
      # deploys; an older commit is skipped (the tip's own CI run deploys it).
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer master's tip ($tip); skipping, the tip's CI run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/$owner/andoza_ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$owner/andoza_ai-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for api, worker, styles-worker, converter and beat.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.gate.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Vite inlines it at build time. Relative, as in docker-compose.prod.yml:
          # the site calls the API on whichever host served it.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.gate.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    # The server pulls the images from ghcr.io over its own uplink. On 2026-11-09 that ran at
    # ~100 KB/s and the 30-minute limit cancelled the deploy mid-pull (the site stayed on the
    # previous images, unharmed). 60 minutes rides out a slow day.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: SSH setup
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Keepalives: a long, quiet image pull must not be dropped as idle.
          printf '%s\n' 'Host *' \
            '  IdentityFile ~/.ssh/id_deploy' \
            '  IdentitiesOnly yes' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 10' > ~/.ssh/config

      # The job's own token, valid only while this run lasts; logged out below.
      - name: Registry login on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # Copy the script over and run it as a FILE — never
          # `bash -s < deploy/remote-deploy.sh`. Piped that way the script IS
          # the remote bash's stdin, so the first `docker compose exec` inside
          # it reads stdin, swallows the rest of the script, and the deploy
          # truncates silently with exit 0. `ssh -n` additionally gives the
          # remote an empty stdin, so no command over there can consume the
          # deploy itself no matter what gets added to the script later.
          scp deploy/remote-deploy.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:/tmp/andoza-remote-deploy.sh"
          ssh -n "$DEPLOY_USER@$DEPLOY_HOST" \
              "APP_DIR='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' IMAGE_OWNER='$IMAGE_OWNER' bash /tmp/andoza-remote-deploy.sh; \
               rc=\$?; rm -f /tmp/andoza-remote-deploy.sh; exit \$rc"

      - name: Registry logout on the server
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -n "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
